[project]
name = "qae2e-api"
version = "0.1.0"
description = "AI-powered QA automation platform backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "mcp[client]>=1.0",
    "openai>=1.40",
    "temporalio>=1.9",
    "deepeval>=1.0",
    "langfuse>=2.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "botocore>=1.34",
    "playwright>=1.45",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "sqlalchemy-utils>=0.41",
    "great-expectations>=0.18",
    "testcontainers[postgres]>=4.0",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
