# Example GitHub Actions workflow for the QAE2E DevOps execution leg.
# Copy into your automation repo at: .github/workflows/e2e.yml
# Triggered by the workspace "Dispatch CI" button (github_dispatch_workflow) or manually.

name: QAE2E E2E

on:
  workflow_dispatch:
    inputs:
      requirementId:
        description: "QAE2E requirement id (traceability)"
        required: false
        default: ""
      browser:
        description: "Browser for UI tests"
        required: false
        default: "chromium"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # UI tests: TypeScript + Playwright
      - name: Run UI tests
        run: npx playwright test --reporter=junit
        continue-on-error: true

      # API tests: TypeScript + supertest/Jest
      - name: Run API tests
        run: npx jest --reporters=jest-junit
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            junit.xml
            junit*.xml
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
